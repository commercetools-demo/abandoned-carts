deployAs:
  - name: mc-app
    applicationType: merchant-center-custom-application
    configuration:
      standardConfiguration:
        - key: CUSTOM_APPLICATION_ID
          description: The ID of the custom application.
          required: true
        - key: CLOUD_IDENTIFIER
          description: The cloud identifier.
          default: gcp-us
        - key: ENTRY_POINT_URI_PATH
          description: The entry point URI path.
          required: true
        - key: APPLICATION_URL
          description: The application URL.
          default: https://your_app_hostname.com
      securedConfiguration: []
  - name: service
    applicationType: service
    endpoint: /service
    configuration:
      standardConfiguration:
        - key: CTP_REGION
          description: commercetools Composable Commerce API region
          default: us-central1.gcp
          required: true
  - name: job
    applicationType: job
    endpoint: /job
    properties:
      schedule: "*/5 * * * *"
  - name: order-created-event
    applicationType: event
    endpoint: /order-created-event
  - name: mail-sender
    applicationType: event
    endpoint: /mailSender
    scripts:
      postDeploy: npm install && npm run connector:post-deploy
      preUndeploy: npm install && npm run connector:pre-undeploy
    configuration:
      standardConfiguration:
        - key: CTP_REGION
          description: commercetools Composable Commerce API region
        - key: SENDER_EMAIL_ADDRESS
          description: sender's email address displayed in the email
      securedConfiguration:
        - key: EMAIL_PROVIDER_API_KEY
          description: The API key used to communicate with email provider
inheritAs:
  apiClient:
    scopes:
      - manage_key_value_documents
      - manage_carts
      - view_orders
      - manage_subscriptions # only for event application types that use Subscriptions
  configuration:
    standardConfiguration:
      - key: ABANDONED_CART_SERVICE_URL
        description: Service URL
        default: http://localhost:8080
        required: true
