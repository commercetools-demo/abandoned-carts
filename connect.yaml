deployAs:
  # The Merchant Center surface: the abandonment rules, the email a shopper
  # gets, the queue of carts that qualified, and a Run now button.
  - name: mc-app
    applicationType: merchant-center-custom-application
    configuration:
      standardConfiguration:
        - key: CUSTOM_APPLICATION_ID
          description: >-
            Assigned by the Merchant Center when the Custom Application is
            registered under Settings > Custom Applications.
          required: true
        - key: CLOUD_IDENTIFIER
          description: >-
            Merchant Center API region the app talks to. gcp-us for Google
            Cloud Iowa, gcp-eu for Belgium.
          required: true
          default: gcp-us
        - key: ENTRY_POINT_URI_PATH
          description: The Application entry point URI path chosen at registration.
          required: true
          default: abandoned-carts
        - key: APPLICATION_URL
          description: >-
            The deployed URL of this application, as registered in the
            Merchant Center. Known only after the first deployment, so the
            first deploy carries a placeholder and the second carries the
            real one.
          required: true
          default: https://your_app_hostname.com

  # Finds the carts that have gone quiet and records one Custom Object per
  # cart. postDeploy creates the Type that carries the `abandoned` flag, so a
  # fresh Project needs no manual setup.
  - name: service
    applicationType: service
    endpoint: /abandoned-cart
    scripts:
      postDeploy: npm install && npm run build && npm run connector:post-deploy
      preUndeploy: npm install && npm run build && npm run connector:pre-undeploy
    configuration:
      standardConfiguration:
        - key: ABANDONED_CART_MAX_PER_RUN
          description: >-
            How many carts one run may record. A Project with a backlog of
            stale carts would otherwise mail every one of them on the first
            run. What the cap skipped is written to the service log.
          required: false
          default: '10'
        - key: ABANDONED_CART_MARK_CARTS
          description: >-
            Whether to write custom.abandoned onto the cart. A Cart carries
            exactly one custom Type, so this replaces whatever Type it
            already had — set it to false in a Project where something else
            already puts one on carts. Declining costs only the Cart
            Discount; nothing about correctness depends on the flag.
          required: false
          default: 'true'

  # Runs the service on a schedule. ABANDONED_CART_SERVICE_URL is inherited
  # and must be set to the service application's deployed URL — see the README.
  - name: job
    applicationType: job
    endpoint: /job
    properties:
      schedule: '*/5 * * * *'

  # Watches for the Custom Object the service writes, and sends the email.
  - name: mail-sender
    applicationType: event
    endpoint: /mailSender
    scripts:
      postDeploy: npm install && npm run connector:post-deploy
      preUndeploy: npm install && npm run connector:pre-undeploy
    configuration:
      standardConfiguration:
        - key: ABANDONED_CART_FROM
          description: >-
            From address on the email, for example
            "Acme <carts@mail.acme.com>". The domain must be verified in
            Resend. Left at the default, Resend only delivers to the address
            that owns the account.
          required: false
          default: Abandoned Carts <onboarding@resend.dev>
        - key: ABANDONED_CART_DEMO_RECIPIENT
          description: >-
            Demo mode. When set, every email is delivered to this one address
            instead of the shopper's, with a line naming who it was addressed
            to. Delivery is otherwise real. Leave UNSET in production.
          required: false
      securedConfiguration:
        - key: RESEND_API_KEY
          description: >-
            Resend API key. Leave unset to run without sending: carts are
            still recorded and every message is rendered and stored on the
            Custom Object, which the Merchant Center application shows.
          required: false

  # Marks a recorded cart as converted when it turns into an order.
  - name: order-created-event
    applicationType: event
    endpoint: /order-created-event
    scripts:
      postDeploy: npm install && npm run build && npm run connector:post-deploy
      preUndeploy: npm install && npm run build && npm run connector:pre-undeploy

inheritAs:
  # Connect generates one API Client for the whole Connector and injects
  # CTP_PROJECT_KEY / CTP_CLIENT_ID / CTP_CLIENT_SECRET / CTP_SCOPE /
  # CTP_API_URL / CTP_AUTH_URL at runtime. Those keys must not be declared
  # above or the two collide.
  apiClient:
    scopes:
      - manage_key_value_documents
      - manage_orders
      - view_customers
      - manage_subscriptions
      - manage_types
  configuration:
    standardConfiguration:
      - key: CTP_REGION
        description: >-
          Region hosting the commercetools Project, used to build the auth
          host. us-central1.gcp for Google Cloud Iowa.
        required: true
        default: us-central1.gcp
      - key: ABANDONED_CART_SERVICE_URL
        description: >-
          Base URL of the service application, used by the job to trigger a
          run and by the Merchant Center application's Run now button. Connect
          assigns it at deployment, so it is set on the second deploy.
        required: true
        default: http://localhost:8080
